openapi: 3.0.3
info:
  title: Nexora API
  version: 1.1.0
  description: >
    Backend API for multi-tenant SACCO management. Every resource route is served
    under /api/v1 (see docs/api-conventions.md); the health check is unversioned.
    Error bodies are {"error": "message"}.
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    sacco_id:
      name: sacco_id
      in: path
      required: true
      schema: {type: integer}
    membership_id:
      name: membership_id
      in: path
      required: true
      schema: {type: integer}
    account_id:
      name: account_id
      in: path
      required: true
      schema: {type: integer}
paths:
  /api/health:
    get:
      summary: Health check (unversioned)
      responses:
        '200':
          description: Database reachable.
        '503':
          description: Database not configured or unreachable.
  /api/v1/auth/register:
    post:
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '201':
          description: Account created (id, email).
        '400':
          description: Invalid email or a password that fails the strength rules.
        '409':
          description: Email already registered.
  /api/v1/auth/login:
    post:
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          description: access_token, refresh_token, token_type.
        '401':
          description: Invalid email or password.
        '423':
          description: Account locked, or the user's SACCO is suspended.
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: A new token pair.
        '400':
          description: refresh_token missing.
        '401':
          description: Invalid or expired refresh token.
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: Logged out.
        '401':
          description: Invalid or expired refresh token.
  /api/v1/auth/change-password:
    post:
      summary: Change the signed-in user's password
      description: >
        A wrong current_password counts as a failed login and follows the same
        lockout. Success revokes every refresh token of the user, so they sign in
        again. Access tokens already issued stay valid until they expire (15 minutes).
        Rate limit: 5 per minute, like login.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, maxLength: 128}
                new_password: {type: string, minLength: 8, maxLength: 128}
      responses:
        '200':
          description: '{"message": "Password changed. Sign in again."}'
        '400':
          description: Missing field, new password too short, too long, contains the email, or equal to the current one.
        '401':
          description: No valid access token, or wrong current password (same message as a failed login).
        '423':
          description: Account temporarily locked.
        '429':
          description: Too many requests.
  /api/v1/auth/logout-all:
    post:
      summary: Revoke every refresh token of the signed-in user
      description: Also works for members of a suspended SACCO.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: '{"message": "Logged out everywhere."}'
        '401':
          description: Authentication required.
  /api/v1/saccos:
    get:
      summary: List SACCOs (Platform Owner only)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: '{"saccos": [{id, name, currency, status, created_at}]}'
        '401':
          description: Authentication required.
        '403':
          description: Platform owner access required.
    post:
      summary: Create a SACCO (Platform Owner only)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 255}
                currency:
                  type: string
                  default: KES
                  description: Three-letter ISO code, upper-cased.
      responses:
        '201':
          description: SACCO created.
        '400':
          description: Invalid name or currency.
        '401':
          description: Authentication required.
        '403':
          description: Platform owner access required.
        '409':
          description: >
            A SACCO with this name already exists (unique index, case and space
            insensitive).
  /api/v1/saccos/{sacco_id}/activate:
    post:
      summary: Activate a SACCO (Platform Owner only)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/sacco_id'
      responses:
        '200':
          description: Status is active.
        '401':
          description: Authentication required.
        '403':
          description: Platform owner access required.
        '404':
          description: SACCO not found.
  /api/v1/saccos/{sacco_id}/deactivate:
    post:
      summary: Deactivate a SACCO (Platform Owner only)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/sacco_id'
      responses:
        '200':
          description: Status is suspended.
        '401':
          description: Authentication required.
        '403':
          description: Platform owner access required.
        '404':
          description: SACCO not found.
  /api/v1/saccos/{sacco_id}/members:
    get:
      summary: List one SACCO's members (Platform Owner or that SACCO's admin)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/sacco_id'
      responses:
        '200':
          description: '{"members": [{id, user_id, email, role, status, created_at}]}'
        '401':
          description: Authentication required.
        '403':
          description: Not an active administrator of this SACCO.
        '404':
          description: SACCO not found.
    post:
      summary: Add an existing user to a SACCO (Platform Owner or that SACCO's admin)
      description: >
        The user must already have an account. Only the platform owner may create
        another SACCO administrator (roles doc, section 7).
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/sacco_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
                role:
                  type: string
                  enum: [member, staff, sacco_admin]
                  default: member
                status:
                  type: string
                  enum: [active, inactive]
                  default: active
      responses:
        '201':
          description: Membership created.
        '400':
          description: Invalid or unknown field.
        '401':
          description: Authentication required.
        '403':
          description: >
            Not this SACCO's administrator, or granting admin rights without
            being the platform owner.
        '404':
          description: SACCO not found, or no registered user with that email.
        '409':
          description: That user is already a member of this SACCO.
  /api/v1/saccos/{sacco_id}/members/{membership_id}:
    get:
      summary: Read one membership (Platform Owner or that SACCO's admin)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/sacco_id'
        - $ref: '#/components/parameters/membership_id'
      responses:
        '200':
          description: The membership.
        '401':
          description: Authentication required.
        '403':
          description: Not an active administrator of this SACCO.
        '404':
          description: No such membership in this SACCO.
    patch:
      summary: Update a member's role or status (Platform Owner or that SACCO's admin)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/sacco_id'
        - $ref: '#/components/parameters/membership_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [member, staff, sacco_admin]
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: The updated membership.
        '400':
          description: Empty body, unknown field, or invalid value.
        '401':
          description: Authentication required.
        '403':
          description: >
            Not this SACCO's administrator, or granting admin rights without
            being the platform owner.
        '404':
          description: No such membership in this SACCO.
  /api/v1/members/me:
    get:
      summary: The caller's own profile and memberships
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: id, email, created_at and memberships.
        '401':
          description: Authentication required.
    patch:
      summary: Change the caller's own email
      description: Requires current_password; wrong guesses count toward the login lockout.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, current_password]
              properties:
                email: {type: string}
                current_password: {type: string}
      responses:
        '200':
          description: The updated profile.
        '400':
          description: Invalid body.
        '401':
          description: Authentication required.
        '403':
          description: Current password incorrect.
        '409':
          description: Email already registered.
        '423':
          description: Account temporarily locked.
  /api/v1/savings/accounts:
    post:
      summary: Open a savings account for one of the caller's SACCO memberships
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: {type: integer}
      responses:
        '201':
          description: Account opened.
        '400':
          description: Invalid body.
        '403':
          description: The caller may not post money in that SACCO.
        '404':
          description: Membership not found in the caller's SACCO.
        '409':
          description: That member already has a savings account.
        '423':
          description: The SACCO is suspended.
  /api/v1/savings/accounts/{account_id}/deposits:
    post:
      summary: Deposit into a savings account (one transaction, ledger-sourced balance)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reference]
              properties:
                amount:
                  type: integer
                  description: Minor units (e.g. cents).
                reference:
                  type: string
                  description: Idempotency key, unique per SACCO.
      responses:
        '201':
          description: Posted.
        '200':
          description: This reference was already posted; the original entry is returned.
        '400':
          description: Invalid amount or reference.
        '403':
          description: The caller may not post money in that SACCO.
        '404':
          description: Account not found in the caller's SACCO.
        '409':
          description: The reference was used for a different request.
        '423':
          description: The SACCO is suspended.
  /api/v1/savings/accounts/{account_id}/withdrawals:
    post:
      summary: Withdraw from a savings account (row lock, never below zero)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/account_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reference]
              properties:
                amount:
                  type: integer
                  description: Minor units (e.g. cents).
                reference:
                  type: string
      responses:
        '201':
          description: Posted.
        '200':
          description: This reference was already posted; the original entry is returned.
        '400':
          description: Invalid amount or reference.
        '403':
          description: The caller may not post money in that SACCO.
        '404':
          description: Account not found in the caller's SACCO.
        '409':
          description: Insufficient funds, or the reference was used for a different request.
        '423':
          description: The SACCO is suspended.