    parameters:
    - $ref: '#/components/parameters/request_id'
    post:
      summary: Approve a support-access request
      description: '**Who:** an active admin of the request''s SACCO, never the requester. Sets the expiry 1 to 24 hours ahead.'
      responses:
        '200':
