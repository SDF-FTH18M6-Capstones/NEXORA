    post:
      summary: Revoke an approved grant at any time
      description: '**Who:** an active admin of the request''s SACCO, never the requester.'
      responses:
        '200':
          description: The request after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
