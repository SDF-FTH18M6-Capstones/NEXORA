  /api/v1/admin/owners/{user_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Revoke a platform owner
      description: '**Who:** platform owner only. Nobody revokes themselves (403); at least two owners always
