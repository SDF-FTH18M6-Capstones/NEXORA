                $ref: '#/components/schemas/Error'
        '404':
          description: Not found, **including another SACCO's record** (`not_found`). Never 403 for tenant
            isolation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/action'
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
  /api/v1/admin/audit:
    get:
      summary: The platform audit log, newest first
      description: '**Who:** platform owner only


        **Rate limit:** 120 per minute.


        Optional `sacco_id` filter. Rows with no SACCO (such as `auth.password_change`) appear only here.'
      responses:
        '200':
          description: A page of audit rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Signed in but not allowed: wrong role or inactive membership (`forbidden`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/action'
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - name: sacco_id
        in: query
        schema:
          type: integer
  /api/v1/savings/accounts/{account_id}/interest:
