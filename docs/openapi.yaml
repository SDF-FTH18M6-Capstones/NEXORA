    parameters:
    - $ref: '#/components/parameters/account_id'
    post:
      summary: Post a deposit
      description: '**Who:** SACCO staff or admin


        **Rate limit:** 20 per minute.


        `reference` is required. A new entry answers **201**; repeating the same reference with the same
        request answers **200** with `replayed: true`; the same reference with a different request is
        409. Staff and admins post money, members cannot (403), and nobody may post on their own account
        (403). Amounts are integers in minor units.'
      responses:
        '201':
          description: New entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posted'
        '200':
          description: Replay of an earlier request with the same reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posted'
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
