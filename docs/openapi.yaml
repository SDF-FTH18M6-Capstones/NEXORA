  /api/v1/savings/transactions/{transaction_id}/reversals:
    parameters:
    - $ref: '#/components/parameters/transaction_id'
    post:
      summary: Reverse a ledger entry
      description: '**Who:** SACCO staff or admin


        **Rate limit:** 20 per minute.


        A reversal is a new opposite entry; nobody may reverse an entry on their own account (403). An
        entry can be reversed once, and a reversal cannot be reversed (409). `reference` is required.
        A new entry answers **201**; repeating the same reference with the same request answers **200**
        with `replayed: true`; the same reference with a different request is 409. Staff and admins post
        money, members cannot (403), and nobody may post on their own account (403). Amounts are integers
        in minor units.'
      responses:
        '201':
          description: The new opposite entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reversal'
        '200':
          description: Replay of an earlier request with the same reference.
          content:
            application/json:
              schema:
