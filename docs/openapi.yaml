                  loan_id:
                    type: integer
                  transaction_id:
                    type: integer
                  amount:
                    type: integer
                  repaid_total:
                    type: integer
                  loan_status:
                    type: string
                  account_balance:
                    type: integer
                  reference:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Minor units. Integers only.
                reference:
                  type: string
                  pattern: ^[A-Za-z0-9._:-]{1,64}$
                  description: Required idempotency key, unique per SACCO.
              required:
              - amount
              - reference
