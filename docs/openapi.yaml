openapi: 3.0.3
info:
  title: Nexora API
  version: 1.2.0
  description: 'Backend API for multi-tenant SACCO management. Every resource route is served under /api/v1;
    the health check is unversioned.


    **Errors** on every route: `{"error": {"code": "not_found", "message": "Not found."}}`. Codes: 400
    validation_error, 401 unauthorized, 403 forbidden, 404 not_found, 405 method_not_allowed, 409 conflict,
    413 payload_too_large, 423 locked, 429 rate_limited, 500 internal_error.


    **Tenancy:** another SACCO''s records answer 404, never 403. A suspended SACCO answers 423.


    **Money** is an integer in minor units (KES: 100 = 1.00). Money routes need a `reference` (idempotency
    key).


    **Pagination:** `page` from 1 and `per_page` (default 20, capped at 100); a bad value is 400.


    **Auth:** `Authorization: Bearer <access_token>`. Access tokens last 15 minutes and stop working at
    once after change-password, reset-password, logout-all or an email change.'
servers:
- url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    sacco_id:
      name: sacco_id
      in: path
      required: true
      schema:
        type: integer
    membership_id:
      name: membership_id
      in: path
      required: true
      schema:
        type: integer
    account_id:
      name: account_id
      in: path
      required: true
      schema:
        type: integer
    transaction_id:
      name: transaction_id
      in: path
      required: true
      schema:
        type: integer
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number.
    per_page:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Rows per page, capped at 100.
    from:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive start date, strictly YYYY-MM-DD (ASCII digits). Must not be after `to`.
    to:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive end date, YYYY-MM-DD.
    action:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
      description: Exact action name, or a prefix ending in `.` such as `savings.`.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    Sacco:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        currency:
          type: string
          example: KES
        status:
          type: string
          enum:
          - active
          - suspended
        created_at:
          type: string
          format: date-time
    Member:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum:
          - member
          - staff
          - sacco_admin
        status:
          type: string
          enum:
          - active
          - inactive
        created_at:
          type: string
          format: date-time
    Profile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        created_at:
          type: string
          format: date-time
        memberships:
          type: array
          items:
            type: object
            properties:
              membership_id:
                type: integer
              sacco_id:
                type: integer
              role:
                type: string
              status:
                type: string
    Account:
      type: object
      properties:
        id:
          type: integer
        membership_id:
          type: integer
        sacco_id:
          type: integer
        balance:
          type: integer
          description: Minor units.
        created_at:
          type: string
          format: date-time
    AccountRow:
      type: object
      properties:
        account_id:
          type: integer
        membership_id:
          type: integer
        email:
          type: string
        balance:
          type: integer
    Posted:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        type:
          type: string
          enum:
          - deposit
          - withdrawal
        amount:
          type: integer
        reference:
          type: string
        balance:
          type: integer
          description: Account balance right after this entry.
        created_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    Reversal:
      type: object
      properties:
        id:
          type: integer
        reverses_id:
          type: integer
        account_id:
          type: integer
        type:
          type: string
          enum:
          - deposit
          - withdrawal
        amount:
          type: integer
        reference:
          type: string
        balance:
          type: integer
        created_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - deposit
          - withdrawal
        amount:
          type: integer
        reference:
          type: string
        created_at:
          type: string
          format: date-time
        reverses_id:
          type: integer
          nullable: true
    Summary:
      type: object
      properties:
        sacco_id:
          type: integer
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        account_count:
          type: integer
        total_balance:
          type: integer
        deposit_total:
          type: integer
        withdrawal_total:
          type: integer
        reversal_count:
          type: integer
    Activity:
      type: object
      properties:
        membership_id:
          type: integer
        email:
          type: string
        account_id:
          type: integer
        transaction_count:
          type: integer
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        actor_id:
          type: integer
          nullable: true
        action:
          type: string
        target:
          type: string
        created_at:
          type: string
          format: date-time
paths:
  /api/health:
    get:
      summary: Health check (unversioned)
      description: '**Who:** anyone.


        **Rate limit:** 120 per minute. Each call opens a database connection.'
      responses:
        '200':
          description: Database reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - healthy
                  database:
                    type: string
                    enum:
                    - connected
        '503':
          description: Database not configured or unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                    enum:
                    - not_configured
                    - disconnected
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/register:
    post:
      summary: Register an account
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        The password must be 8 to 128 characters and must not contain the email. The address starts unverified;
        login does not need it, but a SACCO admin can only add a verified user.'
      responses:
        '201':
          description: Created. A verification link is emailed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicts with current state (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 128
              required:
              - email
              - password
  /api/v1/auth/join:
    post:
      summary: Join a SACCO with a code
      description: |-
        **Who:** a signed-in user holding a join code.

        The code is six digits, valid 15 minutes and usable once. Five wrong entries burn it. On success the phone is linked to the user and a setup token (valid 10 minutes) is returned for setting the circle PIN.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {type: string, maxLength: 20}
                code: {type: string, minLength: 6, maxLength: 6}
              required: [phone, code]
      responses:
        '200':
          description: Phone linked. Send the setup token to the PIN route.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_token: {type: string}
                  membership_id: {type: integer}
                required: [setup_token, membership_id]
        '400': {description: "Wrong code or unknown phone (CODE_WRONG).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Missing or invalid access token (unauthorized).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "Code already used or burned (CODE_USED), the phone belongs to another account, or the user is already a member.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: "Code expired (CODE_EXPIRED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: "Rate limit exceeded (rate_limited).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/join/pin:
    post:
      summary: Set the circle PIN and activate the membership
      description: |-
        **Who:** the signed-in user who just joined.

        Sets a four-digit PIN (stored hashed). The membership changes from invited to active.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token: {type: string}
                pin: {type: string, minLength: 4, maxLength: 4}
              required: [setup_token, pin]
      responses:
        '200':
          description: PIN set, membership active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership_id: {type: integer}
                  status: {type: string, enum: [active]}
                required: [membership_id, status]
        '400': {description: "The PIN is not exactly four digits.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Missing or invalid access token, or the setup token is invalid or expired.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "The setup token belongs to someone else (NOT_ALLOWED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "The membership is already set up.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: "Rate limit exceeded (rate_limited).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/circle-login:
    post:
      summary: Check the circle PIN
      description: |-
        **Who:** a signed-in user with an active membership in the SACCO.

        Five wrong PINs lock the PIN for 15 minutes (PIN_LOCKED).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sacco_id: {type: integer}
                pin: {type: string, minLength: 4, maxLength: 4}
              required: [sacco_id, pin]
      responses:
        '200':
          description: PIN correct.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  membership_id: {type: integer}
                  role: {type: string}
                required: [ok, membership_id, role]
        '401': {description: "Missing or invalid access token, or wrong PIN (PIN_WRONG).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "No active membership in that SACCO (NOT_ALLOWED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '423': {description: "The PIN is locked (PIN_LOCKED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: "Rate limit exceeded (rate_limited).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/login:
    post:
      summary: Sign in
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        Five failed logins lock the account for 15 minutes (423). A user whose SACCOs are all suspended
        gets 423.'
      responses:
        '200':
          description: Token pair. Access token lasts 15 minutes, refresh token 7 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                required:
                - access_token
                - refresh_token
                - token_type
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 128
              required:
              - email
              - password
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: '**Who:** anyone holding a refresh token


        **Rate limit:** 30 per minute.


        Each refresh token works once. Replaying a spent token more than 10 seconds later revokes all
        of the user''s refresh tokens.'
      responses:
        '200':
          description: A new token pair. Always store the newest refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                required:
                - access_token
                - refresh_token
                - token_type
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  /api/v1/auth/logout:
    post:
      summary: Revoke one refresh token
      description: '**Who:** anyone holding a refresh token


        **Rate limit:** 30 per minute.'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  /api/v1/auth/logout-all:
    post:
      summary: End every session of the signed-in user
      description: '**Who:** any signed-in user, even if their SACCO is suspended


        **Rate limit:** 30 per minute.


        Writes the audit row `auth.logout_all`.'
      responses:
        '200':
          description: Every refresh token is revoked and every access token issued so far stops working,
            including this one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/auth/change-password:
    post:
      summary: Change the signed-in user's password
      description: '**Who:** any signed-in user, even if their SACCO is suspended


        **Rate limit:** 5 per minute (per IP).


        A wrong `current_password` is 401 and counts as a failed login (same lockout). The new password
        follows the register rules and must differ from the current one. Writes the audit row `auth.password_change`.'
      responses:
        '200':
          description: Password changed. All sessions end; sign in again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  maxLength: 128
                new_password:
                  type: string
                  maxLength: 128
              required:
              - current_password
              - new_password
  /api/v1/auth/verify-email:
    post:
      summary: Confirm an email address
      description: '**Who:** anyone holding the emailed token


        **Rate limit:** 5 per minute (per IP).


        The link is single-use and valid for 24 hours. 400 for a wrong, used or expired token.'
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 100
              required:
              - token
  /api/v1/auth/resend-verification:
    post:
      summary: Send a new verification link
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        Replaces any earlier link for the user.'
      responses:
        '200':
          description: Always the same answer, whether or not the address exists or needs verifying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  /api/v1/auth/forgot-password:
    post:
      summary: Email a password-reset link
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        The link lasts 1 hour and replaces any earlier reset link. This is also how an account locked
        by repeated wrong guesses is recovered.'
      responses:
        '200':
          description: Always the same answer, whether or not the address has an account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  /api/v1/auth/reset-password:
    post:
      summary: Set a new password from an emailed link
      description: '**Who:** anyone holding the emailed token


        **Rate limit:** 5 per minute (per IP).


        The link works once. The new password follows the register rules. A successful reset also marks
        the email verified, clears the lockout and revokes every session. A weak password is 400 and does
        not spend the link. Writes the audit row `auth.password_reset`.'
      responses:
        '200':
          description: Password reset. Every session ends; sign in with the new password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 100
                new_password:
                  type: string
                  maxLength: 128
              required:
              - token
              - new_password
  /api/v1/members/me:
    get:
      summary: The caller's own profile
      description: '**Who:** any signed-in user


        **Rate limit:** 120 per minute.'
      responses:
        '200':
          description: Profile with memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    patch:
      summary: Change the caller's own email
      description: '**Who:** any signed-in user


        **Rate limit:** 30 per minute.


        Needs `current_password`. A wrong one is 403 and counts toward the lockout. Only `email` can change.'
      responses:
        '200':
          description: Updated profile. The new address is unverified, a link is emailed, and every session
            ends (sign in again).
          content:
            application/json:
              schema:
