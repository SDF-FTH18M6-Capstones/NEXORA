  /api/v1/saccos/{sacco_id}/members/{membership_id}/roles:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    - $ref: '#/components/parameters/membership_id'
    get:
      summary: A member's job titles
      description: '**Who:** holders of `member.manage` (the SACCO admin), or the platform owner.'
      responses:
        '200':
          description: The titles held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
    put:
      summary: Set a member's job titles
      description: '**Who:** holders of `member.manage` (the SACCO admin), or the platform owner. Replaces the whole list. Only the
        platform owner edits an admin''s titles; nobody changes their own titles; the membership must
        be active (409). `circle_admin` follows the SACCO admin role: keep it on an admin and leave it
        off everyone else (409), and make or remove admins with PATCH /saccos/{sacco_id}/members/{membership_id},
        which moves the title with the role.'
      responses:
        '200':
          description: The titles now held.
          content:
