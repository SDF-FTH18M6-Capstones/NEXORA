name: Secrets

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    name: Verified secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --only-verified keeps the gate honest: it reports credentials that were
      # proven live against their service, not strings that merely look like one.
      - name: Scan for live credentials
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --fail
